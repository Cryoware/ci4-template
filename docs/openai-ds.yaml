openapi: 3.1.1
info:
  title:  Generation 2 API
  description: API for management system
  version: 1.0.0
  contact:
    name: API Support
    email: support@localhost.com
  license:
    name: Proprietary
    url: https://www.localhost.com/terms

servers:
  - url: http://localhost:8484/api/v1
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionAuth:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    # Common schemas
    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        last_page:
          type: integer
          example: 5

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Resource not found"
        code:
          type: string
          example: "NOT_FOUND"
        details:
          type: object
          nullable: true

    # App Config
    AppConfig:
      type: object
      properties:
        config_id:
          type: integer
          readOnly: true
        config_key:
          type: string
          example: "site_name"
        config_value:
          type: string
          example: "Cryoware"
        config_data_type:
          type: string
          enum: [string, integer, boolean, array, json]
        description:
          type: string
          nullable: true
        is_public:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    AppConfigUpdate:
      type: object
      properties:
        config_value:
          type: string
        description:
          type: string
          nullable: true
        is_public:
          type: boolean

    # Audit Log
    AuditLog:
      type: object
      properties:
        log_id:
          type: integer
          readOnly: true
        event_timestamp:
          type: string
          format: date-time
          readOnly: true
        user_id:
          type: integer
          nullable: true
        station_id:
          type: integer
          nullable: true
        reel_id:
          type: integer
          nullable: true
        tank_id:
          type: integer
          nullable: true
        device_id:
          type: integer
          nullable: true
        event_id:
          type: integer
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        target_user_id:
          type: integer
          nullable: true
        target_tank_id:
          type: integer
          nullable: true
        description:
          type: string
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        metadata:
          type: object
          nullable: true

    AuditLogFilter:
      type: object
      properties:
        user_id:
          type: integer
          nullable: true
        station_id:
          type: integer
          nullable: true
        tank_id:
          type: integer
          nullable: true
        event_id:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time

    # User Management
    User:
      type: object
      properties:
        user_id:
          type: integer
          readOnly: true
        external_uuid:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          example: "jstrong"
        email:
          type: string
          format: email
          example: "jim.strong@testdealership.com"
        first_name:
          type: string
          example: "Jim"
        last_name:
          type: string
          example: "Strong"
        company_id:
          type: integer
        department_id:
          type: integer
          nullable: true
        language_id:
          type: integer
          default: 1
        time_zone_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
          default: true
        is_locked:
          type: boolean
          default: false
        lockout_reason:
          type: string
          enum: [failed_attempts, manual, vacation, other]
          nullable: true
        lockout_until:
          type: string
          format: date-time
          nullable: true
        must_change_password:
          type: boolean
          default: false
        agreed_to_terms:
          type: boolean
          default: false
        agreed_to_terms_at:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        last_login_ip:
          type: string
          nullable: true
        last_login_user_agent:
          type: string
          nullable: true
        last_logout_at:
          type: string
          format: date-time
          nullable: true
        last_logout_type:
          type: string
          enum: [user, timeout, system]
          nullable: true
        account_expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          nullable: true
          readOnly: true
        updated_by:
          type: integer
          nullable: true
          readOnly: true

    UserCreate:
      type: object
      required:
        - username
        - email
        - first_name
        - last_name
        - password
        - company_id
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
          format: password
        pin:
          type: string
          nullable: true
        company_id:
          type: integer
        department_id:
          type: integer
          nullable: true
        language_id:
          type: integer
          default: 1
        time_zone_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
          default: true
        must_change_password:
          type: boolean
          default: false

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        company_id:
          type: integer
        department_id:
          type: integer
          nullable: true
        language_id:
          type: integer
        time_zone_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
        is_locked:
          type: boolean
        lockout_reason:
          type: string
          enum: [failed_attempts, manual, vacation, other]
          nullable: true
        lockout_until:
          type: string
          format: date-time
          nullable: true
        account_expires_at:
          type: string
          format: date-time
          nullable: true

    # Authentication
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        remember_me:
          type: boolean
          default: false

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: "bearer"
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    # Station Management
    Station:
      type: object
      properties:
        station_id:
          type: integer
          readOnly: true
        station_name:
          type: string
          example: "Service Bay 1"
        location_description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
        display_priority:
          type: integer
          default: 1000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # Tank Management
    Tank:
      type: object
      properties:
        tank_id:
          type: integer
          readOnly: true
        tank_name:
          type: string
          example: "Engine Oil 5W-30"
        product_id:
          type: integer
        station_id:
          type: integer
          nullable: true
        tank_shape:
          type: string
          enum: [round_vertical, round_horizontal, rectangular]
          default: round_vertical
        height:
          type: number
          format: float
          nullable: true
        diameter:
          type: number
          format: float
          nullable: true
        width:
          type: number
          format: float
          nullable: true
        length:
          type: number
          format: float
          nullable: true
        capacity:
          type: number
          format: float
        current_volume:
          type: number
          format: float
          default: 0.0
        current_height:
          type: number
          format: float
          nullable: true
        high_level_alarm:
          type: number
          format: float
          nullable: true
        high_level_warning:
          type: number
          format: float
          nullable: true
        reorder_level:
          type: number
          format: float
          nullable: true
        shutoff_level:
          type: number
          format: float
          nullable: true
        is_locked:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # Product Management
    Product:
      type: object
      properties:
        product_id:
          type: integer
          readOnly: true
        customer_product_id:
          type: string
          nullable: true
        product_name:
          type: string
          example: "1000 THF"
        description:
          type: string
          nullable: true
        specific_gravity:
          type: number
          format: float
          default: 1.0
        default_unit_id:
          type: integer
        max_preset_amount:
          type: number
          format: float
          nullable: true
        max_open_amount:
          type: number
          format: float
          nullable: true
        is_collection_only:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # Dispense Transactions
    DispenseTransaction:
      type: object
      properties:
        transaction_id:
          type: integer
          readOnly: true
        transaction_type:
          type: string
          enum: [preset, open, topoff, adjustment, delivery]
        user_id:
          type: integer
        station_id:
          type: integer
        reel_id:
          type: integer
        tank_id:
          type: integer
        product_id:
          type: integer
        work_order_id:
          type: integer
          nullable: true
        preset_amount:
          type: number
          format: float
          nullable: true
        actual_amount:
          type: number
          format: float
        unit_id:
          type: integer
        start_volume:
          type: number
          format: float
        end_volume:
          type: number
          format: float
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_ms:
          type: integer
          nullable: true
        was_successful:
          type: boolean
          default: true
        was_emergency_stop:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true

    DispenseRequest:
      type: object
      required:
        - station_id
        - reel_id
        - amount
        - unit_id
      properties:
        station_id:
          type: integer
        reel_id:
          type: integer
        amount:
          type: number
          format: float
        unit_id:
          type: integer
        work_order_id:
          type: integer
          nullable: true
        is_preset:
          type: boolean
          default: true

    # Work Orders
    WorkOrder:
      type: object
      properties:
        work_order_id:
          type: integer
          readOnly: true
        work_order_number:
          type: string
          example: "WO-2024-001"
        status:
          type: string
          enum: [open, in_progress, completed, closed, cancelled]
          default: open
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    # Role and Permission Management
    Role:
      type: object
      properties:
        role_id:
          type: integer
          readOnly: true
        role_name:
          type: string
          example: "System Administrator"
        role_description:
          type: string
          nullable: true
        is_system_role:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true

    Capability:
      type: object
      properties:
        capability_id:
          type: integer
          readOnly: true
        capability_key:
          type: string
          example: "system.configure"
        capability_name:
          type: string
          example: "Configure System"
        capability_description:
          type: string
          nullable: true
        module:
          type: string
          default: "system"

  parameters:
    userIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the user

    stationIdPath:
      name: station_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the station

    tankIdPath:
      name: tank_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the tank

    productIdPath:
      name: product_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the product

    roleIdPath:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the role

    workOrderIdPath:
      name: work_order_id
      in: path
      required: true
      schema:
        type: integer
      description: ID of the work order

    pageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination

    limitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
        minimum: 1
      description: Number of items per page

  responses:
    UnauthorizedError:
      description: Unauthorized access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized access"
            code: "UNAUTHORIZED"

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Insufficient permissions"
            code: "FORBIDDEN"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Resource not found"
            code: "NOT_FOUND"

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Validation failed"
            code: "VALIDATION_ERROR"
            details:
              username: ["Username is required"]

security:
  - bearerAuth: []
  - sessionAuth: []

paths:
  # Authentication endpoints
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '423':
          description: Account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Invalidate user session
      responses:
        '204':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # User management endpoints
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Retrieve paginated list of users with optional filters
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: company_id
          in: query
          schema:
            type: integer
          description: Filter by company ID
        - name: is_active
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

    post:
      tags: [Users]
      summary: Create user
      description: Create a new user account (requires user.manage capability)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /users/{user_id}:
    get:
      tags: [Users]
      summary: Get user
      description: Retrieve a specific user by ID
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Users]
      summary: Update user
      description: Update user information (requires user.manage capability or own account)
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags: [Users]
      summary: Delete user
      description: Delete a user account (requires user.manage capability)
      parameters:
        - $ref: '#/components/parameters/userIdPath'
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Cannot delete user with active dependencies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Station management endpoints
  /stations:
    get:
      tags: [Stations]
      summary: List stations
      description: Retrieve all stations
      responses:
        '200':
          description: List of stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /stations/{station_id}:
    get:
      tags: [Stations]
      summary: Get station
      description: Retrieve a specific station by ID
      parameters:
        - $ref: '#/components/parameters/stationIdPath'
      responses:
        '200':
          description: Station details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Tank management endpoints
  /tanks:
    get:
      tags: [Tanks]
      summary: List tanks
      description: Retrieve all tanks with current status
      parameters:
        - name: station_id
          in: query
          schema:
            type: integer
          description: Filter by station ID
        - name: include_low_level
          in: query
          schema:
            type: boolean
          description: Include only tanks with low level
      responses:
        '200':
          description: List of tanks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tank'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /tanks/{tank_id}:
    get:
      tags: [Tanks]
      summary: Get tank
      description: Retrieve a specific tank by ID
      parameters:
        - $ref: '#/components/parameters/tankIdPath'
      responses:
        '200':
          description: Tank details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tank'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Product management endpoints
  /products:
    get:
      tags: [Products]
      summary: List products
      description: Retrieve all products
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /products/{product_id}:
    get:
      tags: [Products]
      summary: Get product
      description: Retrieve a specific product by ID
      parameters:
        - $ref: '#/components/parameters/productIdPath'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Dispense endpoints
  /dispense:
    post:
      tags: [Dispense]
      summary: Initiate dispense
      description: Start a dispensing operation (requires station.access and appropriate dispense capabilities)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispenseRequest'
      responses:
        '202':
          description: Dispense initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: integer
                  status:
                    type: string
                    enum: [started, queued]
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Tank locked or insufficient volume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /dispense/transactions:
    get:
      tags: [Dispense]
      summary: List dispense transactions
      description: Retrieve paginated list of dispense transactions
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID
        - name: station_id
          in: query
          schema:
            type: integer
          description: Filter by station ID
        - name: tank_id
          in: query
          schema:
            type: integer
          description: Filter by tank ID
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by start date
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter by end date
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DispenseTransaction'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # Work Order endpoints
  /work-orders:
    get:
      tags: [WorkOrders]
      summary: List work orders
      description: Retrieve paginated list of work orders
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, completed, closed, cancelled]
          description: Filter by status
        - name: created_by
          in: query
          schema:
            type: integer
          description: Filter by creator
      responses:
        '200':
          description: List of work orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkOrder'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags: [WorkOrders]
      summary: Create work order
      description: Create a new work order (requires workorder.create capability)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - work_order_number
              properties:
                work_order_number:
                  type: string
                status:
                  type: string
                  enum: [open, in_progress, completed, closed, cancelled]
                  default: open
      responses:
        '201':
          description: Work order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /work-orders/{work_order_id}:
    get:
      tags: [WorkOrders]
      summary: Get work order
      description: Retrieve a specific work order
      parameters:
        - $ref: '#/components/parameters/workOrderIdPath'
      responses:
        '200':
          description: Work order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [WorkOrders]
      summary: Update work order
      description: Update work order status (requires workorder.manage capability)
      parameters:
        - $ref: '#/components/parameters/workOrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [open, in_progress, completed, closed, cancelled]
      responses:
        '200':
          description: Work order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Audit Log endpoints
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      description: Retrieve paginated audit logs with filtering
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/limitQuery'
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter by user ID
        - name: station_id
          in: query
          schema:
            type: integer
          description: Filter by station ID
        - name: tank_id
          in: query
          schema:
            type: integer
          description: Filter by tank ID
        - name: event_id
          in: query
          schema:
            type: integer
          description: Filter by event type
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for filtering
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: End date for filtering
      responses:
        '200':
          description: List of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # Configuration endpoints
  /config:
    get:
      tags: [Configuration]
      summary: Get public configuration
      description: Retrieve public application configuration
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /config/{config_key}:
    get:
      tags: [Configuration]
      summary: Get configuration value
      description: Retrieve a specific configuration value
      parameters:
        - name: config_key
          in: path
          required: true
          schema:
            type: string
          description: Configuration key
      responses:
        '200':
          description: Configuration value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    put:
      tags: [Configuration]
      summary: Update configuration
      description: Update application configuration (requires system.configure capability)
      parameters:
        - name: config_key
          in: path
          required: true
          schema:
            type: string
          description: Configuration key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Role and Permission endpoints
  /roles:
    get:
      tags: [Roles]
      summary: List roles
      description: Retrieve all roles
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /capabilities:
    get:
      tags: [Roles]
      summary: List capabilities
      description: Retrieve all system capabilities
      responses:
        '200':
          description: List of capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Capability'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

