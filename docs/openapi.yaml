openapi: 3.1.1
info:
  title:  G2 API
  version: v1
  description: |
    Stateless REST API for SPA/mobile clients. All endpoints return a standard envelope
    and use Bearer token authentication (except auth endpoints). See docs/api-format.md.
servers:
  - url: http://localhost:8484
    description: Docker web default
  - url: http://localhost:8080
    description: CI4 built-in server (adjust port)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          description: true for 2xx responses
        code:
          type: string
          description: Machine-readable status code (dot.notation)
        message:
          type: string
        data:
          description: Payload (object, array, or null)
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
        meta:
          $ref: '#/components/schemas/Meta'
      required: [ success ]
    ErrorItem:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
          nullable: true
    Meta:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
          nullable: true
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          type: object
          additionalProperties: true
        etag:
          type: string
          description: ETag value (also returned as ETag header)
    Pagination:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    Tank:
      type: object
      description: |
        Represents a tank. FK: product_id -> products, station_id -> stations. No ON DELETE CASCADE defined
        in dump; related tables (reels, tank_station_map, sensors) refer to tanks.
      properties:
        tank_id: { type: integer }
        tank_name: { type: string }
        product_id: { type: integer }
        station_id: { type: integer, nullable: true }
        tank_shape: { type: string, enum: [round_vertical, round_horizontal, rectangular] }
        height: { type: number, format: double, nullable: true }
        diameter: { type: number, format: double, nullable: true }
        width: { type: number, format: double, nullable: true }
        length: { type: number, format: double, nullable: true }
        capacity: { type: number, format: double }
        current_volume: { type: number, format: double }
        high_level_alarm: { type: number, format: double, nullable: true }
        high_level_warning: { type: number, format: double, nullable: true }
        reorder_level: { type: number, format: double, nullable: true }
        shutoff_level: { type: number, format: double, nullable: true }
        is_locked: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Station:
      type: object
      properties:
        station_id: { type: integer }
        station_name: { type: string }
        location_description: { type: string, nullable: true }
        is_active: { type: boolean }
        display_priority: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Reel:
      type: object
      description: FK station_id -> stations, tank_id -> tanks.
      properties:
        reel_id: { type: integer }
        reel_name: { type: string }
        station_id: { type: integer }
        tank_id: { type: integer }
        is_active: { type: boolean }
        k_factor: { type: number, format: double }
        pulse_count: { type: integer }
        last_calibration_date: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Product:
      type: object
      description: FK default_unit_id -> units.
      properties:
        product_id: { type: integer }
        customer_product_id: { type: string, nullable: true }
        product_name: { type: string }
        description: { type: string, nullable: true }
        specific_gravity: { type: number, format: double }
        default_unit_id: { type: integer }
        max_preset_amount: { type: number, format: double, nullable: true }
        max_open_amount: { type: number, format: double, nullable: true }
        is_collection_only: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Unit:
      type: object
      properties:
        unit_id: { type: integer }
        unit_name: { type: string }
        unit_abbreviation: { type: string }
        is_volume: { type: boolean }
    UserPublic:
      type: object
      description: Public projection of users (sensitive fields omitted).
      properties:
        user_id: { type: integer }
        external_uuid: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        company_id: { type: integer }
        department_id: { type: integer, nullable: true }
        language_id: { type: integer, nullable: true }
        time_zone_id: { type: integer, nullable: true }
        is_active: { type: boolean }
        is_locked: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      properties:
        pin:
          type: string
          description: Numeric PIN (4–10 digits)
      required: [ pin ]
    LoginResponseData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Created
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                success:
                  value:
                    success: true
                    code: auth.logged_in
                    message: Login successful
                    data:
                      user: { user_id: 1, username: admin }
                      access_token: eyJhbGciOi...
                      token_type: Bearer
                      expires_in: 3600
        '400':
          description: Invalid PIN format
        '401':
          description: Authentication failed
  /api/v1/tanks:
    get:
      tags: [Tanks]
      summary: List tanks
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              examples:
                ok:
                  value:
                    success: true
                    code: tanks.list_ok
                    data:
                      - tank_id: 1
                        tank_name: Engine Oil 5W-30
                      - tank_id: 2
                        tank_name: Transmission Fluid
                    meta:
                      etag: '"abc123"'
        '304': { description: Not Modified }
  /api/v1/tanks/{id}:
    get:
      tags: [Tanks]
      summary: Get tank by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404': { description: Not Found }
  /api/v1/stations:
    get:
      tags: [Stations]
      summary: List stations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/reels:
    get:
      tags: [Reels]
      summary: List reels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/units:
    get:
      tags: [Units]
      summary: List units
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
