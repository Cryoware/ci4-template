openapi: 3.1.1
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: http://localhost:8484/api/v2
    description: Local development server
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: >
        Authenticate a user with either username or email (exactly one must be provided) and password.
        Returns a short-lived access token and sets a long-lived HttpOnly refresh token cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LoginRequestUsername'
                - $ref: '#/components/schemas/LoginRequestEmail'
      responses:
        '200':
          description: Successful login
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie named "refresh_token"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /users:
    get:
      tags: [Users]
      summary: List users (requires access token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users fetched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      tags: [Users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  # ... existing code ...
