components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Authentication required or token invalid/expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
          nullable: true

    # --- Auth ---
    LoginRequestUsername:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 3–64 chars; letters, numbers, underscore, dot, hyphen; must not be an email
          example: "xersist"
        password:
          type: string
          format: password

    LoginRequestEmail:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Authentication successful"
        token:
          type: string
          description: Short-lived access token (JWT) to be sent as Bearer token
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserPayload'

    # --- Reusable mixins ---
    Timestamped:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    Activatable:
      type: object
      properties:
        is_active:
          type: boolean
          default: true

    # --- Core domain objects ---
    Company:
      allOf:
        - type: object
          properties:
            company_id:
              type: integer
          required: [company_id, company_name]
        - $ref: '#/components/schemas/Activatable'
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            company_name:
              type: string
              maxLength: 255
              example: "LiquiDynamics, Inc"

    Department:
      allOf:
        - type: object
          properties:
            department_id:
              type: integer
            company_id:
              type: integer
          required: [department_id, company_id, department_name]
        - $ref: '#/components/schemas/Activatable'
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            department_name:
              type: string
              maxLength: 255

    Language:
      type: object
      properties:
        language_id:
          type: integer
        language_code:
          type: string
          description: IETF code (e.g., en, fr, es)
          example: en
        language_name:
          type: string
          example: English
        is_active:
          type: boolean
      required: [language_id, language_code, language_name]

    TimeZone:
      type: object
      properties:
        time_zone_id:
          type: integer
        time_zone_name:
          type: string
          example: "America/Chicago"
        utc_offset:
          type: string
          description: Offset from UTC (e.g., +00:00, -05:00)
          example: "-05:00"
        is_dst:
          type: boolean
      required: [time_zone_id, time_zone_name]

    Role:
      type: object
      properties:
        role_id:
          type: integer
        role_name:
          type: string
          example: "System Administrator"
        role_description:
          type: string
          nullable: true
        is_system_role:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
      required: [role_id, role_name]

    Unit:
      type: object
      properties:
        unit_id:
          type: integer
        unit_name:
          type: string
          example: "Gallon"
        unit_abbreviation:
          type: string
          example: "gal"
        is_volume:
          type: boolean
      required: [unit_id, unit_name, unit_abbreviation]

    Product:
      allOf:
        - type: object
          properties:
            product_id:
              type: integer
          required: [product_id, product_name, default_unit_id]
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            customer_product_id:
              type: string
              nullable: true
            product_name:
              type: string
            description:
              type: string
              nullable: true
            specific_gravity:
              type: number
              format: double
            default_unit_id:
              type: integer
            max_preset_amount:
              type: number
              format: double
              nullable: true
            max_open_amount:
              type: number
              format: double
              nullable: true
            is_collection_only:
              type: boolean
            is_active:
              type: boolean
              default: true

    Tank:
      allOf:
        - type: object
          properties:
            tank_id:
              type: integer
          required: [tank_id, product_id, station_id, tank_name]
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            tank_name:
              type: string
            product_id:
              type: integer
            station_id:
              type: integer
            tank_shape:
              type: string
              nullable: true
            height:
              type: number
              format: double
              nullable: true
            diameter:
              type: number
              format: double
              nullable: true
            width:
              type: number
              format: double
              nullable: true
            length:
              type: number
              format: double
              nullable: true
            capacity:
              type: number
              format: double
              nullable: true
            current_volume:
              type: number
              format: double
              nullable: true
            current_height:
              type: number
              format: double
              nullable: true
            high_level_alarm:
              type: number
              format: double
              nullable: true
            high_level_warning:
              type: number
              format: double
              nullable: true
            reorder_level:
              type: number
              format: double
              nullable: true
            shutoff_level:
              type: number
              format: double
              nullable: true
            is_active:
              type: boolean
              default: true

    Reel:
      allOf:
        - type: object
          properties:
            reel_id:
              type: integer
          required: [reel_id, reel_name, station_id, tank_id]
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            reel_name:
              type: string
            station_id:
              type: integer
            tank_id:
              type: integer
            is_active:
              type: boolean
              default: true
            k_factor:
              type: number
              format: double
              description: calibration factor
            pulse_count:
              type: integer
            last_calibration_date:
              type: string
              format: date
              nullable: true

    Station:
      allOf:
        - type: object
          properties:
            station_id:
              type: integer
          required: [station_id, station_name]
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            station_name:
              type: string
            location_description:
              type: string
              nullable: true
            is_active:
              type: boolean
              default: true
            display_priority:
              type: integer

    # --- Users ---
    User:
      allOf:
        - type: object
          properties:
            user_id:
              type: integer
          required: [user_id, username, email]
        - $ref: '#/components/schemas/Timestamped'
        - type: object
          properties:
            external_uuid:
              type: string
              nullable: true
            username:
              type: string
              example: "jstrong"
            email:
              type: string
              format: email
            first_name:
              type: string
            last_name:
              type: string
            company_id:
              type: integer
              nullable: true
            department_id:
              type: integer
              nullable: true
            language_id:
              type: integer
              nullable: true
            time_zone_id:
              type: integer
              nullable: true
            is_active:
              type: boolean
              default: true
            is_locked:
              type: boolean
              default: false
            lockout_reason:
              type: string
              nullable: true
            lockout_until:
              type: string
              format: date-time
              nullable: true
            must_change_password:
              type: boolean
              default: false
            agreed_to_terms:
              type: boolean
              default: false
            agreed_to_terms_at:
              type: string
              format: date-time
              nullable: true
            last_login_at:
              type: string
              format: date-time
              nullable: true
            last_login_ip:
              type: string
              nullable: true
            last_login_user_agent:
              type: string
              nullable: true
            last_logout_at:
              type: string
              format: date-time
              nullable: true
            last_logout_type:
              type: string
              nullable: true
            account_expires_at:
              type: string
              format: date-time
              nullable: true
            updated_by:
              type: integer
              nullable: true
            created_by:
              type: integer
              nullable: true

    # Enriched user payload for auth and profile endpoints
    UserPayload:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            company:
              $ref: '#/components/schemas/Company'
            department:
              $ref: '#/components/schemas/Department'
            time_zone:
              $ref: '#/components/schemas/TimeZone'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/Role'
            station_permissions:
              type: array
              description: Stations the user can access
              items:
                type: object
                properties:
                  station_id:
                    type: integer
                  station_name:
                    type: string
                  can_access:
                    type: boolean
            reel_permissions:
              type: array
              description: Reels the user can dispense from
              items:
                type: object
                properties:
                  reel_id:
                    type: integer
                  reel_name:
                    type: string
                  can_dispense:
                    type: boolean
            tank_permissions:
              type: array
              description: Tanks user has permissions for
              items:
                type: object
                properties:
                  tank_id:
                    type: integer
                  tank_name:
                    type: string
                  can_dispense:
                    type: boolean
                  can_override:
                    type: boolean
tags:
  - name: Authentication
    description: User authentication
  - name: Users
    description: User listing
  - name: Languages
    description: Manage languages
  - name: Companies
    description: Manage companies
  - name: Departments
    description: Manage departments
  - name: Units
    description: Manage measurement units (volume or non-volume)
