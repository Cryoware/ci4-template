              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  token: { type: string }
                  expires_in: { type: integer }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
