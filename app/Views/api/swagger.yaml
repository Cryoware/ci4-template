        '401': { $ref: '#/components/responses/UnauthorizedError' }
  /refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Rotates the HttpOnly refresh cookie and returns a new access token. Requires the refresh_token cookie. No Authorization header required.
      security: []
      responses:
        '200':
          description: Token refreshed
          headers:
